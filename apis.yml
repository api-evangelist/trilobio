name: Trilobio
description: >-
  Trilobio builds whole-lab automation for genetic engineering, synthetic
  biology, and life-science research — affordable robotics "built by biologists,
  for biologists." The platform pairs the Trilobot (a self-calibrating,
  tool-changing lab robot with 16 deck slots), interchangeable gripper/pipette
  tools, and Trilobio OS (no-code, GUI-driven protocol design with automatic
  sample layout, error checking, an automated lab notebook, and LIMS). For
  developers, Trilobio exposes T-code — the command language of Trilobots —
  through the open-source Python `tcode-api` package, which drives a Trilobot
  fleet via a local T-code Servicer and integrates third-party lab devices.
  Founded in 2021 in San Francisco by Roya Amini-Naieni and Maximilian Schommer;
  backed by Initialized Capital, Argon Ventures, and Lowercarbon Capital.
