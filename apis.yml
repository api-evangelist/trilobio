apis:
- name: TCode API (tcode-api)
  description: >-
    Python interfaces for the core T-code components that drive a Trilobot fleet
    — Commands, Labware, Locations, Scripts — plus the T-code Servicer client for
    runtime control and the Integrator client for third-party device
    integration. Local control API (runs on the fleet control computer); no
    network credentials.
