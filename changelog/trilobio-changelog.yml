- version: '1.41.0'
  breaking: false
  additions:
  - Added `tcode_api.cli.robot_serial_number_annotation` (plac canned annotation for
    targeting a specific robot), in preparation for single-robot targeting within fleets.
  - Integrated robot targeting by serial number into all tcode_api scripts.
  - Updated demo plate walkthrough to include pipette volume parametrically.
- version: '1.40.1'
  breaking: false
  fixes:
  - Fixed `TCodeServicerClient` requests call to the tcode servicer `serial_number_lookup`
    endpoint.
- version: '1.40.0'
  breaking: false
  additions:
  - Added `TCodeServicerClient.serial_number_lookup` method.
  - Added `SerialNumberLookupRequest`, `SerialNumberLookupResponse`, and
    `SerialNumberLookupResult` models for the serial-number lookup API (fetch serial
    numbers of entities resolved to ids by the tcode service).
